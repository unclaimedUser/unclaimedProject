name: agent
on:
  # Only the `agent` label starts a run. Opening or editing an issue is free,
  # so issues can serve as the to-do list without spending credits.
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: agent-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
jobs:
  run:
    # The labeler (sender) must be the owner; anyone else's label is ignored.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'agent' &&
       github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_BASE_URL: https://openrouter.ai/api
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: anthropic/claude-sonnet-4.6
      CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i -g @anthropic-ai/claude-code

      - name: Run
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE" --body "Agent started."
          BODY=$(gh issue view "$ISSUE" --json title,body -q '.title + "\n\n" + .body')
          BRANCH="agent/issue-$ISSUE"

          git config user.name "unclaimed-agent"
          git config user.email "agent@users.noreply.github.com"
          # -B, not -b: a re-run must reset the branch instead of failing on it.
          git checkout -B "$BRANCH"

          set +e
          echo "$BODY" | claude -p --max-turns 40 \
            --permission-mode dontAsk \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" \
              "Bash(git:*)" "Bash(npm:*)" "Bash(npx:*)" \
            > /tmp/claude.log 2>&1
          CODE=$?
          set -e
          echo "claude exit: $CODE"
          tail -n 30 /tmp/claude.log

          # Commit anything the agent left uncommitted. Stage first: git diff
          # ignores untracked files until they are staged.
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: resolve #$ISSUE"
          fi

          # Measure work as commits ahead of main, not uncommitted changes.
          # The agent may commit (and push) on its own.
          AHEAD=$(git rev-list --count origin/main..HEAD)
          if [ "$AHEAD" -eq 0 ]; then
            gh issue comment "$ISSUE" --body "No changes produced (exit $CODE). Log tail:

          \`\`\`
          $(tail -n 15 /tmp/claude.log)
          \`\`\`"
            exit 0
          fi

          # Verify here, because PRs created with GITHUB_TOKEN never trigger
          # the ci workflow. A failure is reported, not fatal: the owner decides.
          set +e
          { npm test && npm run --if-present check:kb; } > /tmp/verify.log 2>&1
          VCODE=$?
          set -e
          if [ "$VCODE" -eq 0 ]; then VERIFY=PASS; else VERIFY=FAIL; fi

          {
            echo "Closes #$ISSUE. Autonomous — review the diff."
            echo
            echo "### Verification: $VERIFY"
            echo '```'
            tail -n 40 /tmp/verify.log
            echo '```'
            echo
            echo "Generated with Claude Code via OpenRouter."
          } > /tmp/pr.md

          git push -f origin "$BRANCH"

          EXISTING=$(gh pr list --head "$BRANCH" --json number -q '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "$(gh issue view "$ISSUE" --json title -q .title)" \
              --body-file /tmp/pr.md
          else
            gh pr comment "$EXISTING" --body-file /tmp/pr.md
            gh issue comment "$ISSUE" --body "Updated existing PR #$EXISTING."
          fi

      - name: Report failure
        if: failure()
        run: |
          gh issue comment "$ISSUE" --body "Job failed — see the Actions log.

          \`\`\`
          $(tail -n 20 /tmp/claude.log 2>/dev/null || echo 'no claude log')
          \`\`\`" || true

      # Remove the label so adding it again triggers a fresh run.
      - name: Release label
        if: always() && github.event_name == 'issues'
        run: gh issue edit "$ISSUE" --remove-label agent || true