name: agent
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: agent-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
jobs:
  run:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i -g @anthropic-ai/claude-code
      - name: Run
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api/v1
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_MODEL: anthropic/claude-sonnet-4.6
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE" --body "Agent started."
          BODY=$(gh issue view "$ISSUE" --json title,body -q '.title + "\n\n" + .body')
          BRANCH="agent/issue-$ISSUE"
          git checkout -b "$BRANCH"
          echo "$BODY" | claude -p --max-turns 40 \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(npm:*),Bash(npx:*)" || true
          if git diff --quiet && git diff --cached --quiet; then
            gh issue comment "$ISSUE" --body "No changes produced. Check the Actions log."
            exit 0
          fi
          git config user.name "unclaimed-agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A && git commit -m "feat: resolve #$ISSUE"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "$(gh issue view "$ISSUE" --json title -q .title)" \
            --body "Closes #$ISSUE. Autonomous — review the diff."
