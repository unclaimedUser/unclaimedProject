name: ci
on:
  pull_request:
  push:
    branches: [main]
# Read-only: CI needs no secrets and no write access, so it is safe on fork PRs.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
      - run: npm run check:kb