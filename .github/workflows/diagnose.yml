name: diagnose
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe OpenRouter
        env:
          K: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "key length: ${#K}"
          echo "key prefix: ${K:0:8}..."
          echo "--- /key ---"
          curl -s -H "Authorization: Bearer $K" https://openrouter.ai/api/v1/key
          echo
          echo "--- model access status ---"
          curl -s -o /dev/null -w "sonnet-4.6 endpoints: HTTP %{http_code}\n" \
            https://openrouter.ai/api/v1/models/anthropic/claude-sonnet-4.6/endpoints
          echo "--- test completion ---"
          curl -s -H "Authorization: Bearer $K" -H "Content-Type: application/json" \
            -d '{"model":"anthropic/claude-sonnet-4.6","max_tokens":16,"messages":[{"role":"user","content":"say ok"}]}' \
            https://openrouter.ai/api/v1/chat/completions | head -c 600
